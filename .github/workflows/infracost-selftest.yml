name: infracost-selftest

# Testes dos scripts do workflow reutilizável do Infracost (infracost/) e lint dos workflows.
on:
  pull_request:
    paths: ['infracost/**', '.github/workflows/infracost*.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Instalar pytest (só wheels) e shellcheck
        run: |
          set -euo pipefail
          python -m pip install -q --only-binary=:all: pytest
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
      - name: Instalar actionlint 1.7.12 (checksum conferido)
        run: |
          set -euo pipefail
          f=actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSL --retry 3 -o "/tmp/$f" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$f"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/$f" | sha256sum -c -
          tar -xzf "/tmp/$f" -C /tmp actionlint
      - name: shellcheck
        run: shellcheck infracost/scripts/*.sh
      - name: actionlint
        run: /tmp/actionlint .github/workflows/infracost*.yml
      - name: pytest
        run: python -m pytest infracost/tests -q -p no:cacheprovider
