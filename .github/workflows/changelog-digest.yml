name: changelog-digest

# Digest do changelog tech no Slack. Doc: docs/CHANGELOG_TECH.md.
# Segunda a sexta às 09:00 BRT (12:00 UTC; BRT não tem horário de verão) posta o diário;
# na segunda posta também o semanal, com os PRs `partner:breaking` ainda abertos.
on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Qual digest montar.'
        type: choice
        options: [daily, weekly]
        default: daily
      since:
        description: 'Início da janela em ISO 8601 (ex: 2026-10-27T09:00:00-03:00). Vazio = janela padrão do modo.'
        required: false
        default: ''
      dry_run:
        description: 'Só mostra a mensagem no log, sem postar no Slack.'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: changelog-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # O GITHUB_TOKEN deste repo não enxerga os repos do piloto (privados). O digest usa um
      # token só de leitura de pull requests nesses repos.
      - name: Confere o token de leitura dos repos do piloto
        env:
          CHANGELOG_GH_TOKEN: ${{ secrets.CHANGELOG_GH_TOKEN }}
        run: |
          if [ -z "$CHANGELOG_GH_TOKEN" ]; then
            echo "::error::Secret CHANGELOG_GH_TOKEN ausente (token só leitura de PRs nos repos do piloto). Ver docs/CHANGELOG_TECH.md."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: scripts/changelog
          persist-credentials: false

      - name: Monta e posta o digest
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          SLACK_CHANGELOG_WEBHOOK: ${{ secrets.SLACK_CHANGELOG_WEBHOOK }}
        with:
          github-token: ${{ secrets.CHANGELOG_GH_TOKEN }}
          script: |
            const digest = require(`${process.env.GITHUB_WORKSPACE}/scripts/changelog/digest.js`);
            await digest.run({ github, context, core });
