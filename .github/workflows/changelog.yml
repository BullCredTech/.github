name: changelog

# Gate do changelog tech. Exigido nos repos do piloto pelo ruleset da org `changelog-required`.
# Doc: docs/CHANGELOG_TECH.md.
#
# ATENÇÃO: como workflow de ruleset, o GitHub só dispara nos tipos padrão de `pull_request`
# (opened, synchronize, reopened) e ignora filtros de branch. Os demais tipos abaixo só valem se
# este arquivo rodar como workflow local. Quando labels ou descrição mudam, quem re-executa o check
# é o classificador (logo depois de rotular) e a ponte `changelog-bridge` (para mudanças humanas);
# ver "Quando o gate roda" no doc.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

# Rajadas de eventos (duas labels aplicadas em sequência): só a avaliação mais recente importa.
concurrency:
  group: changelog-gate-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog-gate:
    name: changelog-gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Roda no contexto do repo alvo: os scripts vêm do BullCredTech/.github (público) no mesmo
      # commit deste workflow, então gate e workflow nunca ficam fora de sincronia.
      - name: Baixa os scripts do changelog (BullCredTech/.github)
        uses: actions/checkout@v4
        with:
          repository: BullCredTech/.github
          ref: ${{ github.workflow_sha }}
          path: .changelog-bot
          sparse-checkout: scripts/changelog
          persist-credentials: false

      - name: Avalia labels e campos do PR
        uses: actions/github-script@v7
        with:
          script: |
            const gate = require(`${process.env.GITHUB_WORKSPACE}/.changelog-bot/scripts/changelog/gate.js`);
            await gate.run({ github, context, core });
