name: security-checks-selftest

# Testes dos scripts do workflow central (security-checks/) e lint dos workflows, em PRs que mexem neles.
on:
  pull_request:
    paths: ['security-checks/**', '.github/workflows/security-checks-*.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: '3.12' }
      - name: Instalar bats e shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats shellcheck
      - name: Instalar pytest (só wheels)
        run: |
          python -m pip install -q --only-binary=:all: pytest
      - name: Instalar actionlint 1.7.12 (checksum conferido)
        run: |
          set -euo pipefail
          f=actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSL --retry 3 -o "/tmp/$f" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$f"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/$f" | sha256sum -c -
          tar -xzf "/tmp/$f" -C /tmp actionlint
      - name: shellcheck
        run: shellcheck security-checks/scripts/*.sh
      - name: actionlint
        run: /tmp/actionlint .github/workflows/*.yml
      - name: bats (todos os testes têm de rodar, nenhum pulado)
        run: |
          set -euo pipefail
          esperados="$(cat security-checks/tests/*.bats | grep -c '^@test' || true)"
          bats --tap security-checks/tests/*.bats | tee "$RUNNER_TEMP/bats.tap"
          rodados="$(grep -cE '^(ok|not ok) ' "$RUNNER_TEMP/bats.tap" || true)"
          if grep -qE '^not ok |# skip' "$RUNNER_TEMP/bats.tap"; then echo "::error::há teste falhando ou pulado"; exit 1; fi
          if [ "$rodados" != "$esperados" ]; then
            echo "::error::o bats rodou $rodados de $esperados testes (nome de teste com caractere que o bats não aceita?)"
            exit 1
          fi
          echo "bats: $rodados/$esperados testes ok"
      - name: pytest
        run: python -m pytest security-checks/tests -q -p no:cacheprovider
